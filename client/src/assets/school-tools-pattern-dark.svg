<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" fill="none" stroke="#15141E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Straight Ruler -->
  <g transform="translate(25, 30) rotate(-12)">
    <rect x="0" y="0" width="105" height="24" rx="3" fill="none" />
    <line x1="12" y1="0" x2="12" y2="10" />
    <line x1="22" y1="0" x2="22" y2="6" />
    <line x1="32" y1="0" x2="32" y2="10" />
    <line x1="42" y1="0" x2="42" y2="6" />
    <line x1="52" y1="0" x2="52" y2="10" />
    <line x1="62" y1="0" x2="62" y2="6" />
    <line x1="72" y1="0" x2="72" y2="10" />
    <line x1="82" y1="0" x2="82" y2="6" />
    <line x1="92" y1="0" x2="92" y2="10" />
  </g>

  <!-- Pencil -->
  <g transform="translate(180, 20) rotate(38)">
    <rect x="0" y="0" width="68" height="12" rx="1.5" fill="none" />
    <line x1="0" y1="4" x2="68" y2="4" />
    <line x1="0" y1="8" x2="68" y2="8" />
    <!-- Eraser end -->
    <path d="M -10,0 L 0,0 L 0,12 L -10,12 Q -14,6 -10,0 Z" fill="none" />
    <line x1="-3" y1="0" x2="-3" y2="12" />
    <!-- Sharpened Tip -->
    <polygon points="68,0 84,6 68,12" fill="none" />
    <polygon points="78,3 84,6 78,9" fill="#15141E" fill-opacity="0.8" />
  </g>

  <!-- Triangle Ruler / Set Square -->
  <g transform="translate(305, 25) rotate(15)">
    <polygon points="0,75 80,75 0,0" fill="none" />
    <polygon points="12,65 60,65 12,22" fill="none" />
    <line x1="18" y1="75" x2="18" y2="69" />
    <line x1="28" y1="75" x2="28" y2="71" />
    <line x1="38" y1="75" x2="38" y2="69" />
    <line x1="48" y1="75" x2="48" y2="71" />
    <line x1="58" y1="75" x2="58" y2="69" />
    <line x1="68" y1="75" x2="68" y2="71" />
  </g>

  <!-- Protractor -->
  <g transform="translate(30, 150) rotate(8)">
    <path d="M 0,40 A 38,38 0 0,1 76,40 Z" fill="none" />
    <path d="M 18,40 A 20,20 0 0,1 58,40 Z" fill="none" />
    <line x1="38" y1="36" x2="38" y2="40" />
    <line x1="12" y1="26" x2="16" y2="28" />
    <line x1="24" y1="12" x2="27" y2="16" />
    <line x1="38" y1="4" x2="38" y2="9" />
    <line x1="52" y1="12" x2="49" y2="16" />
    <line x1="64" y1="26" x2="60" y2="28" />
  </g>

  <!-- Geometry Compass -->
  <g transform="translate(175, 140) rotate(-15)">
    <circle cx="20" cy="8" r="5" fill="none" />
    <line x1="20" y1="13" x2="5" y2="65" />
    <line x1="20" y1="13" x2="35" y2="65" />
    <line x1="12" y1="38" x2="28" y2="38" />
    <!-- Needle tip -->
    <line x1="5" y1="65" x2="3" y2="72" />
    <!-- Pencil leg -->
    <rect x="32" y="55" width="6" height="14" rx="1" fill="none" />
    <polygon points="32,69 35,75 38,69" fill="#15141E" fill-opacity="0.8" />
  </g>

  <!-- Scissors -->
  <g transform="translate(310, 145) rotate(25)">
    <circle cx="10" cy="55" r="9" fill="none" />
    <circle cx="30" cy="52" r="9" fill="none" />
    <path d="M 15,48 L 48,6" fill="none" />
    <path d="M 26,45 L 2,12" fill="none" />
    <circle cx="20" cy="30" r="2.5" fill="#15141E" />
  </g>

  <!-- Open Book -->
  <g transform="translate(25, 275) rotate(-6)">
    <path d="M 45,10 C 30,4 15,6 0,10 L 0,42 C 15,38 30,36 45,42 C 60,36 75,38 90,42 L 90,10 C 75,6 60,4 45,10 Z" fill="none" />
    <line x1="45" y1="10" x2="45" y2="42" />
    <!-- Page lines -->
    <line x1="8" y1="18" x2="37" y2="15" />
    <line x1="8" y1="25" x2="37" y2="22" />
    <line x1="8" y1="32" x2="37" y2="29" />
    <line x1="53" y1="15" x2="82" y2="18" />
    <line x1="53" y1="22" x2="82" y2="25" />
    <line x1="53" y1="29" x2="82" y2="32" />
  </g>

  <!-- Calculator -->
  <g transform="translate(165, 260) rotate(10)">
    <rect x="0" y="0" width="44" height="62" rx="6" fill="none" />
    <rect x="6" y="8" width="32" height="12" rx="2" fill="none" />
    <!-- Keypad -->
    <circle cx="12" cy="28" r="2.5" fill="#15141E" />
    <circle cx="22" cy="28" r="2.5" fill="#15141E" />
    <circle cx="32" cy="28" r="2.5" fill="#15141E" />
    <circle cx="12" cy="38" r="2.5" fill="#15141E" />
    <circle cx="22" cy="38" r="2.5" fill="#15141E" />
    <circle cx="32" cy="38" r="2.5" fill="#15141E" />
    <circle cx="12" cy="48" r="2.5" fill="#15141E" />
    <circle cx="22" cy="48" r="2.5" fill="#15141E" />
    <circle cx="32" cy="48" r="2.5" fill="#15141E" />
  </g>

  <!-- Graduation Cap -->
  <g transform="translate(285, 270) rotate(-10)">
    <polygon points="40,5 78,20 40,35 2,20" fill="none" />
    <path d="M 18,27 L 18,44 C 18,50 62,50 62,44 L 62,27" fill="none" />
    <!-- Tassel -->
    <path d="M 40,20 Q 72,28 74,48" fill="none" />
    <circle cx="74" cy="50" r="2" fill="#15141E" />
  </g>

  <!-- Eraser & Paperclip & Chemistry Flask Floating Fillers -->
  <!-- Eraser -->
  <g transform="translate(100, 360) rotate(-20)">
    <polygon points="0,15 32,0 45,12 13,27" fill="none" />
    <line x1="16" y1="7" x2="29" y2="19" />
  </g>

  <!-- Paperclip -->
  <g transform="translate(380, 210) rotate(35)">
    <path d="M 6,0 L 6,24 A 6,6 0 0,0 18,24 L 18,8 A 4,4 0 0,0 10,8 L 10,22" fill="none" />
  </g>

  <!-- Science Flask -->
  <g transform="translate(235, 365) rotate(8)">
    <path d="M 14,0 L 22,0 M 18,0 L 18,10 L 6,32 A 4,4 0 0,0 10,38 L 26,38 A 4,4 0 0,0 30,32 L 18,10" fill="none" />
    <line x1="11" y1="28" x2="25" y2="28" />
  </g>

  <!-- Small Doodles / Sparks / Crosses -->
  <g transform="translate(145, 100)">
    <line x1="0" y1="4" x2="8" y2="4" />
    <line x1="4" y1="0" x2="4" y2="8" />
  </g>
  <g transform="translate(265, 95)">
    <circle cx="3" cy="3" r="2.5" fill="none" />
  </g>
  <g transform="translate(385, 90)">
    <line x1="0" y1="3" x2="6" y2="3" />
    <line x1="3" y1="0" x2="3" y2="6" />
  </g>
  <g transform="translate(115, 230)">
    <circle cx="2" cy="2" r="2" fill="none" />
  </g>
  <g transform="translate(250, 220)">
    <polygon points="4,0 5,3 8,4 5,5 4,8 3,5 0,4 3,3" fill="#15141E" fill-opacity="0.8" />
  </g>
  <g transform="translate(365, 360)">
    <circle cx="3" cy="3" r="2.5" fill="none" />
  </g>
  <g transform="translate(15, 385)">
    <line x1="0" y1="3" x2="6" y2="3" />
    <line x1="3" y1="0" x2="3" y2="6" />
  </g>
</svg>
